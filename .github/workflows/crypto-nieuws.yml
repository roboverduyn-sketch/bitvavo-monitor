name: Crypto nieuwscontrole

on:

  workflow_dispatch:

  schedule:

    - cron: "*/30 * * * *"

permissions:

  contents: write

jobs:

  nieuwscontrole:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Bestanden ophalen

        uses: actions/checkout@v5

      - name: Python installeren

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"
      
      - name: Cryptonieuws controleren

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: python crypto_nieuws.py

      - name: Verzonden nieuws bewaren

        if: always()

        run: |

          if [ -f verzonden_nieuws.json ]; then

            git config user.name "github-actions[bot]"

            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add verzonden_nieuws.json

            if ! git diff --cached --quiet; then

              git commit -m "Verzonden cryptonieuws bijwerken"

              git push

            fi

          fi
