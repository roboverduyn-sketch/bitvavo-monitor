name: Bitvavo automatische monitor

on:

  workflow_dispatch:

  schedule:

    - cron: "17 * * * *"

permissions:

  contents: write

jobs:

  monitor:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Bestanden ophalen

        uses: actions/checkout@v4

      - name: Python installeren

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Bitvavo controleren

        run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Fictieve portefeuille bewaren

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add portefeuille.json

          if ! git diff --cached --quiet; then

            git commit -m "Fictieve portefeuille bijgewerkt"

            git push

          fi
