name: Bitvavo automatische monitor

on:

  workflow_dispatch:

  schedule:

    - cron: "17 * * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
permissions:

  contents: write
concurrency:

  group: bitvavo-monitor

  cancel-in-progress: false
jobs:

  monitor:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Bestanden ophalen

        uses: actions/checkout@v5

      - name: Python installeren

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"

      - name: Bitvavo controleren

        run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Amsterdam
          DAGRAPPORT: ${{ (github.event.schedule == '0 18 * * *' && '1') || (github.event.schedule == '0 19 * * *' && '1') || '0' }}
      - name: Fictieve portefeuille bewaren

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add portefeuille.json transacties.json volumes.json

          if ! git diff --cached --quiet; then

            git commit -m "Fictieve portefeuille bijgewerkt"

            git push

          fi
